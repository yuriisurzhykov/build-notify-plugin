org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
# On non-Mac hosts (Windows/Linux) Kotlin/Native cannot compile Apple targets.
# This flag skips them gracefully instead of failing the build.
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 bridge. Our KMP modules apply `com.android.library` / `com.android.application`
# next to the Kotlin Multiplatform plugin, which AGP 9's new DSL and built-in Kotlin do
# not support. These keep the AGP 8 behaviour until the modules move to
# `com.android.kotlin.multiplatform.library`; AGP 10 removes both flags.
android.builtInKotlin=false
android.newDsl=false
