# Shared detekt rules for ide-plugin and mobile-app.
#
# Applied on top of detekt's default config (buildUponDefaultConfig = true): only the
# differences live here. The goal is short files, short functions and flat logic.
# Existing violations are frozen in each module's detekt-baseline.xml; new code must pass.

config:
  validation: true
  warningsAsErrors: false

complexity:
  # A class longer than this is doing more than one thing.
  LargeClass:
    active: true
    allowedLines: 299
  LongMethod:
    active: true
    allowedLines: 49
  LongParameterList:
    active: true
    allowedFunctionParameters: 5
    allowedConstructorParameters: 7
    ignoreDefaultParameters: true
    # Composables expose parameters as their public API (modifier, callbacks, slots).
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 11
    # A flat exhaustive `when` over a sealed type is the clearest form, not complexity.
    ignoreSimpleWhenEntries: true
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 14
  NestedBlockDepth:
    active: true
    allowedDepth: 3
  ComplexCondition:
    active: true
    allowedConditions: 3
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 14
    allowedFunctionsPerClass: 14
    allowedFunctionsPerInterface: 11
    allowedFunctionsPerObject: 14
    allowedFunctionsPerEnum: 7
    ignorePrivate: true
    ignoreOverridden: true
  NestedScopeFunctions:
    active: true
    allowedDepth: 1
  StringLiteralDuplication:
    active: true
    excludes: ['**/test/**', '**/*Test.kt', '**/commonTest/**']

style:
  # Formatting belongs to ktlint; detekt checks structure and design.
  NewLineAtEndOfFile:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: true
  ReturnCount:
    active: true
    max: 3
    excludeGuardClauses: true
  ThrowsCount:
    active: true
    max: 3
  MagicNumber:
    active: true
    # Graphite token files are where the numbers are defined; everything else reads them.
    excludes: ['**/test/**', '**/*Test.kt', '**/commonTest/**', '**/designsystem/particles/theme/**']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreEnums: true
    # Design tokens and colours are literal by nature.
    ignoreAnnotated: ['Composable', 'Preview']
  WildcardImport:
    active: true
    excludeImports: []
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Track the work in an issue instead of leaving a FIXME.'
        value: 'FIXME:'
      - reason: 'Remove or resolve before merging.'
        value: 'STOPSHIP:'
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  AbstractClassCanBeConcreteClass:
    active: true
  AbstractClassCanBeInterface:
    active: true
  UseCheckOrError:
    active: true
  DestructuringDeclarationWithTooManyEntries:
    active: true
    maxDestructuringEntries: 3

naming:
  FunctionNaming:
    active: true
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    # SCREAMING_CASE constants plus PascalCase Compose tokens (`val Fast`, icons).
    constantPattern: '[A-Z][_A-Za-z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  LateinitUsage:
    active: true
    excludes: ['**/test/**', '**/*Test.kt']
    ignoreOnClassesPattern: '.*(Service|Activity|Application)'

coroutines:
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
    excludes: ['**/test/**', '**/*Test.kt', '**/commonTest/**']
  SuspendFunWithFlowReturnType:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: true
    # Boundaries (transport, VMs) map any failure to a user-visible state.
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  SwallowedException:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'
